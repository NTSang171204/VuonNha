version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: farm-ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farm_ecommerce
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: farm-ecommerce-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/farm_ecommerce?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      API_PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    container_name: farm-ecommerce-storefront
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      STOREFRONT_URL: http://localhost:3001
    ports:
      - '3001:3001'
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: farm-ecommerce-admin
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      ADMIN_URL: http://localhost:3002
    ports:
      - '3002:3002'
    depends_on:
      - api

volumes:
  postgres_data:
